name: ZedLink
options:
  bundleIdPrefix: dev.zedlink
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ZedLink:
    type: application
    platform: iOS
    sources:
      - ZedLink
    scheme:
      testTargets:
        - ZedLinkTests
        - ZedLinkUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zedlink.app
        MARKETING_VERSION: 1.0.18
        CURRENT_PROJECT_VERSION: 19
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZedLink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate a draft message or terminal input. Nothing is sent until you choose Send.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Convert your voice into editable draft text using on-device recognition.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your paired ZedLink gateway on your private network.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the ZedLink pairing QR shown on your workstation.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ZedLink/ZedLink.entitlements
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
  ZedLinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ZedLinkUITests
    dependencies:
      - target: ZedLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zedlink.app.uitests
        GENERATE_INFOPLIST_FILE: YES
  ZedLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ZedLinkTests
    dependencies:
      - target: ZedLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zedlink.app.tests
        GENERATE_INFOPLIST_FILE: YES
